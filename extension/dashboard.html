<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT Task Manager</title><link rel="stylesheet" href="dashboard.css"></head><body>
<header><div><span class="eyebrow">WORKSPACE MONITOR</span><h1>GPT Task Manager</h1><p>모든 대화를 한눈에, 데이터는 이 기기에만.</p></div><button id="full" title="전체 화면">↗ <span>전체 화면</span></button></header>
<main><section class="stats" aria-label="작업 요약"><div><span>전체 탭</span><strong id="total">0</strong></div><div><span>작업 중</span><strong id="working">0</strong></div><div><span>미확인 완료</span><strong id="done">0</strong></div><div><span>오류 / 제한</span><strong id="errors">0</strong></div></section>
<section class="toolbar"><div><h2>작업 목록</h2><p>탭을 선택하면 해당 대화로 이동합니다.</p></div><button id="read">모두 읽음</button></section>
<div class="filters"><input id="search" type="search" placeholder="프로젝트 또는 대화 검색" aria-label="검색"><select id="filter" aria-label="상태 필터"><option value="all">모든 상태</option><option value="PROCESSING">작업 중</option><option value="COMPLETED">완료</option><option value="ERROR">오류 / 제한</option><option value="UNKNOWN">확인 불가 / 중단</option></select></div>
<div id="list" class="list" aria-live="polite"></div>
<details><summary>알림 설정</summary><div class="settings"><label><input type="checkbox" id="desktop"> 데스크톱 알림</label><label><input type="checkbox" id="sound"> 알림음</label><label>음량 <input type="range" id="volume" min="0" max="1" step="0.05"></label><label><input type="checkbox" id="privacy"> 알림에서 이름 숨기기</label><label><input type="checkbox" id="skipActive"> 현재 보고 있는 탭 제외</label><label><input type="checkbox" id="dnd"> 방해 금지</label><label><input type="checkbox" id="favicon"> 탭 파비콘 상태 표시 (실험적)</label><button id="test">알림 테스트</button></div></details>
<details><summary>도움말 및 감지 상태</summary><p>ChatGPT 페이지를 열거나 새로고침하세요. 감지 중단과 확인 불가는 완료가 아닙니다. 사이트 화면이 변경되면 감지가 실패할 수 있습니다. 대화 내용은 저장하지 않습니다.</p></details>
<footer>LOCAL ONLY <span>·</span> ChatGPT DOM 기반 감지 <span>·</span> 실서비스 검증 필요</footer></main><script src="dashboard.js"></script></body></html>
